services:
  application:
    image: APP_IMAGE
    restart: always
    network_mode: host
    volumes:
      - ./certbot/www:/app/public/.well-known/acme-challenge
  nginx:
    image: nginx:alpine
    restart: always
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - application
