services:
  application:
    image: APP_IMAGE
    restart: always
#    volumes:
#      - ./certbot/www:/app/public/.well-known/acme-challenge
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - application