name: Build image and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/neuroguard-ai
  APPLICATION_PATH: /opt/neuroguard


jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN  }}

      - name: Build and push application
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.APP_IMAGE }}:${{ github.sha }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "Host *
            StrictHostKeyChecking no" > ~/.ssh/config

      - name: Deploy docker compose file
        run: |
          sed -i "s|APP_IMAGE|${{ env.APP_IMAGE }}:${{ github.sha }}|g" docker-compose.yaml
          scp docker-compose.yaml ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:${APPLICATION_PATH}
          scp nginx/nginx.conf ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:${APPLICATION_PATH}/nginx

      - name: Up docker compose stack
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p "${{ secrets.DOCKERHUB_PASSWORD }}" && \
            cd ${APPLICATION_PATH} && \
            docker compose down || true && \
            docker compose pull && \
            docker compose up -d && \
            docker system prune -f && \
            docker logout
          "